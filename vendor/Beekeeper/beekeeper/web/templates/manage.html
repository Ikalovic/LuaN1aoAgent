{% extends "base.html" %}
{% block title %}Manage{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h2 class="text-3xl font-bold text-yellow-400 mb-8">Manage Data</h2>

    <!-- Flash Message -->
    {% if message %}
    <div class="mb-6 px-4 py-3 rounded-lg {% if msg_type == 'success' %}bg-green-900/50 border border-green-700 text-green-300{% elif msg_type == 'warning' %}bg-yellow-900/50 border border-yellow-700 text-yellow-300{% else %}bg-red-900/50 border border-red-700 text-red-300{% endif %}">
        {{ message }}
    </div>
    {% endif %}

    <!-- Add Credential Form -->
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 mb-8">
        <h3 class="text-lg font-semibold text-gray-200 mb-4">Add Credential</h3>
        <form action="/manage/add" method="POST" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Domain *</label>
                    <input type="text" name="domain" required placeholder="example.com"
                        class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-yellow-400 transition">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Account *</label>
                    <input type="text" name="account" required placeholder="admin"
                        class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-yellow-400 transition">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password *</label>
                    <input type="text" name="password" required placeholder="password123"
                        class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-yellow-400 transition">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Source</label>
                    <input type="text" name="source" placeholder="breach / manual"
                        class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-yellow-400 transition">
                </div>
            </div>
            <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold px-6 py-2.5 rounded-lg transition">
                + Add Credential
            </button>
        </form>
    </div>

    <!-- Delete by Domain -->
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
        <h3 class="text-lg font-semibold text-gray-200 mb-4">Delete by Domain</h3>
        <div class="flex gap-3 items-end">
            <div class="flex-1">
                <label class="block text-sm text-gray-400 mb-1">Domain</label>
                <input type="text" id="delete-domain-input" placeholder="example.com"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-red-400 transition">
            </div>
            <button
                hx-post="/manage/delete-domain/"
                hx-include="#delete-domain-input"
                hx-target="#delete-result"
                hx-confirm="Are you sure you want to delete all credentials for this domain?"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2.5 rounded-lg transition"
                onclick="this.setAttribute('hx-post', '/manage/delete-domain/' + document.getElementById('delete-domain-input').value)"
            >
                Delete Domain
            </button>
        </div>
        <div id="delete-result" class="mt-4"></div>
    </div>
</div>
{% endblock %}
