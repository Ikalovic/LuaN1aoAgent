<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Target Company{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full bg-gray-100">
    <!-- Top bar -->
    <div class="bg-blue-900 text-white px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🏢</span>
            <div>
                <h1 class="font-bold text-lg">Target Company</h1>
                <p class="text-blue-300 text-xs">Internal Systems Portal</p>
            </div>
        </div>
        <a href="/" class="text-blue-300 hover:text-white text-sm">← All Services</a>
    </div>
    
    <main class="max-w-4xl mx-auto py-8 px-4">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="text-center text-gray-400 text-xs py-4">
        © 2024 Target Company Inc. — Authorized Access Only
    </footer>
</body>
</html>
