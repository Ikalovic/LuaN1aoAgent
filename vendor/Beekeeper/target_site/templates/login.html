{% extends "base.html" %}

{% block title %}{{ svc.name }} — Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <!-- Service header -->
    <div class="text-center mb-8">
        <span class="text-6xl block mb-4">{{ svc.icon }}</span>
        <h2 class="text-2xl font-bold text-gray-800">{{ svc.name }}</h2>
        <p class="text-gray-500 text-sm mt-2">{{ svc.description }}</p>
        <p class="text-gray-400 text-xs mt-1 font-mono">{{ svc.domain }}</p>
    </div>

    <!-- Error message -->
    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
        <div class="flex items-center">
            <span class="text-red-500 mr-2">⛔</span>
            <p class="text-red-700 text-sm font-medium">{{ error }}</p>
        </div>
    </div>
    {% endif %}

    <!-- Login form -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <form method="POST" action="/login/{{ service }}">
            <div class="mb-5">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input type="text" id="username" name="username" 
                       value="{{ username or '' }}"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-800"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-800"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>
            <button type="submit" 
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-md transition-colors duration-200">
                Sign In
            </button>
        </form>
    </div>

    <p class="text-center text-gray-400 text-xs mt-6">
        Authorized personnel only. All access attempts are logged.
    </p>
</div>
{% endblock %}
